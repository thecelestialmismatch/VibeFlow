<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeakWall</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      min-height: 420px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #1e293b;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: #ef4444;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: #34d399;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: #1e293b;
      border-bottom: 1px solid #1e293b;
    }

    .stat {
      background: #0f172a;
      padding: 14px 16px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 10px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .section-title {
      padding: 12px 16px 6px;
      font-size: 10px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .event-list {
      padding: 0 8px;
    }

    .event-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 8px;
    }

    .event-item:hover {
      background: #1e293b;
    }

    .event-icon {
      font-size: 14px;
      flex-shrink: 0;
    }

    .event-body {
      flex: 1;
      min-width: 0;
    }

    .event-type {
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .event-meta {
      font-size: 10px;
      color: #64748b;
    }

    .event-status {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .status-blocked {
      background: rgba(16,185,129,0.1);
      color: #34d399;
      border: 1px solid rgba(52,211,153,0.25);
    }

    .status-warned {
      background: rgba(239,68,68,0.1);
      color: #f87171;
      border: 1px solid rgba(248,113,113,0.25);
    }

    .empty-state {
      padding: 24px 16px;
      text-align: center;
      color: #475569;
    }

    .empty-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .empty-label {
      font-size: 12px;
    }

    .footer {
      padding: 12px 16px;
      border-top: 1px solid #1e293b;
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }

    .btn-primary {
      background: #ef4444;
      color: #fff;
    }

    .btn-secondary {
      background: #1e293b;
      color: #94a3b8;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid #1e293b;
    }

    .toggle-label {
      font-size: 12px;
      color: #94a3b8;
    }

    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #334155;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .slider:before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle input:checked + .slider {
      background: #ef4444;
    }

    .toggle input:checked + .slider:before {
      transform: translateX(16px);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <div class="logo-icon">🛡️</div>
      LeakWall
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      <span id="status-text">Protected</span>
    </div>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Protection enabled</span>
    <label class="toggle">
      <input type="checkbox" id="toggle-enabled" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="stats-row">
    <div class="stat">
      <div class="stat-value" id="stat-blocked">—</div>
      <div class="stat-label">Leaks Blocked</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-tools">10</div>
      <div class="stat-label">AI Tools Watched</div>
    </div>
  </div>

  <div class="section-title">Recent Events</div>
  <div class="event-list" id="event-list">
    <div class="empty-state">
      <div class="empty-icon">✅</div>
      <div class="empty-label">No leaks detected yet.<br />You&apos;re protected.</div>
    </div>
  </div>

  <div class="footer">
    <button class="btn btn-secondary" id="btn-clear">Clear history</button>
    <button class="btn btn-primary" id="btn-dashboard">Dashboard ↗</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
